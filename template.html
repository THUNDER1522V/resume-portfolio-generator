<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{name}} — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="hero">
    <div class="window-bar">
      <span class="win-dot red"></span><span class="win-dot yellow"></span><span class="win-dot green"></span>
      <span class="window-title">portfolio.html</span>
    </div>
    <div class="hero-content">
      <p class="prompt-line"><span class="prompt-user">visitor</span><span class="prompt-symbol">@</span><span class="prompt-host">portfolio</span><span class="prompt-symbol">:~$</span> whoami</p>
      <h1 class="name">{{name}}</h1>
      <p class="comment-line">// {{headline}}</p>
    </div>
  </header>

  <main>
    <section class="file-card" id="summary">
      <div class="file-tab"><span class="tab-dot dot-md"></span>summary.md</div>
      <div class="file-body">
        <p>{{summary}}</p>
      </div>
    </section>

    {{sections}}
  </main>

  <footer>
    <p class="comment-line">// generated from resume.txt via the Gemini API</p>
  </footer>

</body>
</html>
